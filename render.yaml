# Render Blueprint — see https://render.com/docs/blueprint-spec
#
# requirements.txt lives at the repo root but the Django project itself lives in
# server/, so build/start commands install from root then `cd server` for anything
# Django-specific, rather than moving requirements.txt (keeps the existing repo layout
# untouched).
#
# Using this Blueprint (New -> Blueprint in the Render dashboard, pointed at this repo)
# reproduces the exact config below. If your Web Service was created manually instead,
# this file documents the equivalent dashboard settings you should already have — see
# Build Command / Start Command / env vars.
services:
  - type: web
    name: khelomore-server
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && cd server && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "cd server && gunicorn server.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      # Secrets — set these manually in the Render dashboard (Environment tab); never
      # commit real values. See server/.env.example for what each one does.
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: MONGO_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: IV
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      # Non-secret config — safe defaults, override in the dashboard if needed.
      - key: DEBUG
        value: "False"
      - key: MONGO_DB_NAME
        value: KheloMoreDB
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXP_DELTA_SECONDS
        value: "2592000"
      - key: JWT_ADMIN_EXP_DELTA_SECONDS
        value: "86400"
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: PYTHON_VERSION
        value: "3.12.0"
